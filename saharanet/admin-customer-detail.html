<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Detail - Admin - Sahara Net</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="page-wrapper">
        <header class="custom-clean-header">
            <div class="header-top-row">
                <a href="admin-dashboard.html"><img src="images/Sahara-Net-logo.png" class="clean-logo-img"></a>
                <span style="font-weight:700; color:#5d3567;">ADMIN</span>
            </div>
            <div class="header-navigation-bar">
                <button class="nav-toggle-btn" onclick="toggleMobileNav()" aria-label="Menu">&#9776;</button>
                <ul id="main-nav-list">
                    <li><a href="admin-dashboard.html">Dashboard</a></li>
                    <li><a href="admin-customers.html">Customers</a></li>
                    <li><a href="admin-plans.html">Plans</a></li>
                    <li><a href="admin-tickets.html">Support Tickets</a></li>
                    <li><a href="admin-reports.html">Reports</a></li>
                    <li><a href="admin-settings.html">Settings</a></li>
                    <li><a href="#" onclick="logoutUser(); return false;">Logout</a></li>
                </ul>
            </div>
        </header>

        <section class="dashboard-content">
            <a href="admin-customers.html" style="color:#5d3567; text-decoration:none; font-weight:600;">&larr; Back to Customers</a>

            <div class="dashboard-card" style="margin-top:15px;">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:15px;">
                    <div style="flex:1; min-width:250px;">
                        <h2 id="customer-name-header" style="color:#5d3567; margin:0 0 15px;">Loading...</h2>
                        <form id="editCustomerForm">
                            <div class="custom-form-group"><label>Full Name</label><input type="text" id="edit-name" required></div>
                            <div class="custom-form-group"><label>Email</label><input type="email" id="edit-email" required></div>
                            <div class="custom-form-group"><label>Company</label><input type="text" id="edit-company"></div>
                            <button type="submit" class="small-btn primary">Save Changes</button>
                        </form>
                    </div>
                    <div style="text-align:right;">
                        <span id="customer-status-badge" class="status-badge">-</span>
                        <div style="margin-top:10px; display:flex; flex-direction:column; gap:8px;">
                            <button class="small-btn primary" onclick="toggleStatus('active')">Set Active</button>
                            <button class="small-btn danger" onclick="toggleStatus('suspended')">Suspend</button>
                            <button class="small-btn danger" onclick="deleteCustomer()" style="margin-top:15px;">Delete Customer</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="dashboard-card">
                <h3 style="color:#5d3567; margin-top:0;">Subscriptions</h3>
                <div id="bookings-list"><p class="empty-state">Loading...</p></div>
            </div>

            <div class="dashboard-card">
                <h3 style="color:#5d3567; margin-top:0;">Invoices</h3>
                <div id="invoices-list"><p class="empty-state">Loading...</p></div>
            </div>
        </section>
    </div>

    <footer id="footer">All rights reserved to Sahara Net &copy; 1989 - 2026</footer>
    <div id="notification" class="notification-toast"><span id="notification-text"></span></div>

    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        const customerId = new URLSearchParams(window.location.search).get('id');

        async function init() {
            const admin = await requireAdmin();
            if (!admin) return;

            if (!customerId) {
                document.querySelector('.dashboard-content').innerHTML = '<p class="empty-state">No customer specified.</p>';
                return;
            }

            await loadCustomer();
            await loadBookings();
            await loadInvoices();
        }

        async function loadCustomer() {
            const { data: customer, error } = await supabase.from('customer').select('*').eq('customer_id', customerId).single();
            if (error || !customer) {
                document.querySelector('.dashboard-content').innerHTML = '<p class="empty-state">Customer not found.</p>';
                return;
            }
            document.getElementById('customer-name-header').innerText = customer.name;
            document.getElementById('edit-name').value = customer.name;
            document.getElementById('edit-email').value = customer.email;
            document.getElementById('edit-company').value = customer.company ?? '';
            const badge = document.getElementById('customer-status-badge');
            badge.innerText = customer.status;
            badge.className = 'status-badge status-' + customer.status;
        }

        document.getElementById('editCustomerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabase.from('customer').update({
                name: document.getElementById('edit-name').value,
                email: document.getElementById('edit-email').value,
                company: document.getElementById('edit-company').value
            }).eq('customer_id', customerId);

            if (error) { showNotification(error.message, 'error'); return; }
            showNotification('Customer updated successfully', 'success');
            loadCustomer();
        });

        async function deleteCustomer() {
            if (!confirm('Delete this customer permanently? This cannot be undone.')) return;

            const { error } = await supabase.from('customer').delete().eq('customer_id', customerId);
            if (error) {
                showNotification('Cannot delete: this customer has existing bookings or invoices. Suspend the account instead.', 'error');
                return;
            }
            showNotification('Customer deleted', 'success');
            setTimeout(() => window.location.href = 'admin-customers.html', 1200);
        }

        async function toggleStatus(newStatus) {
            const { error } = await supabase.from('customer').update({ status: newStatus }).eq('customer_id', customerId);
            if (error) { showNotification(error.message, 'error'); return; }
            showNotification('Customer status updated to ' + newStatus, 'success');
            loadCustomer();
        }

        async function loadBookings() {
            const { data: bookings, error } = await supabase
                .from('booking')
                .select('booking_id, start_date, status, service:service_id (name, price)')
                .eq('customer_id', customerId)
                .order('start_date', { ascending: false });

            const container = document.getElementById('bookings-list');
            if (error) { container.innerHTML = `<p class="empty-state" style="color:red;">${error.message}</p>`; return; }
            if (!bookings || bookings.length === 0) { container.innerHTML = '<p class="empty-state">No subscriptions yet.</p>'; return; }

            container.innerHTML = `
                <table class="data-table">
                    <thead><tr><th>Service</th><th>Price</th><th>Start Date</th><th>Status</th></tr></thead>
                    <tbody>
                        ${bookings.map(b => `
                            <tr>
                                <td>${b.service?.name ?? '-'}</td>
                                <td>${b.service?.price ?? 0} SAR</td>
                                <td>${b.start_date}</td>
                                <td><span class="status-badge status-${b.status}">${b.status}</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function loadInvoices() {
            const { data: invoices, error } = await supabase
                .from('billing')
                .select('*')
                .eq('customer_id', customerId)
                .order('invoice_date', { ascending: false });

            const container = document.getElementById('invoices-list');
            if (error) { container.innerHTML = `<p class="empty-state" style="color:red;">${error.message}</p>`; return; }
            if (!invoices || invoices.length === 0) { container.innerHTML = '<p class="empty-state">No invoices yet.</p>'; return; }

            container.innerHTML = `
                <table class="data-table">
                    <thead><tr><th>Invoice #</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead>
                    <tbody>
                        ${invoices.map(inv => `
                            <tr>
                                <td>#${inv.invoicing_id}</td>
                                <td>${inv.amount} SAR</td>
                                <td>${inv.invoice_date}</td>
                                <td><span class="status-badge status-${inv.payment_status}">${inv.payment_status}</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        init();
    </script>
</body>
</html>
