<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plans - Admin - Sahara Net</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="page-wrapper">
        <header class="custom-clean-header">
            <div class="header-top-row">
                <a href="admin-dashboard.html"><img src="images/Sahara-Net-logo.png" class="clean-logo-img"></a>
                <span style="font-weight:700; color:#5d3567;">ADMIN</span>
            </div>
            <div class="header-navigation-bar">
                <button class="nav-toggle-btn" onclick="toggleMobileNav()" aria-label="Menu">&#9776;</button>
                <ul id="main-nav-list">
                    <li><a href="admin-dashboard.html">Dashboard</a></li>
                    <li><a href="admin-customers.html">Customers</a></li>
                    <li><a href="admin-plans.html">Plans</a></li>
                    <li><a href="admin-tickets.html">Support Tickets</a></li>
                    <li><a href="admin-reports.html">Reports</a></li>
                    <li><a href="admin-settings.html">Settings</a></li>
                    <li><a href="#" onclick="logoutUser(); return false;">Logout</a></li>
                </ul>
            </div>
        </header>

        <section class="dashboard-content">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <div>
                    <h1 style="color:#5d3567; margin-bottom:5px;">Hosting Plans</h1>
                    <p style="color:#777; margin-top:0;">Manage all plans and tools offered to customers</p>
                </div>
                <button class="small-btn primary" style="padding:10px 20px;" onclick="openAddPlan()">+ Add New Plan</button>
            </div>

            <div class="dashboard-card">
                <div id="plans-list"><p class="empty-state">Loading...</p></div>
            </div>
        </section>
    </div>

    <footer id="footer">All rights reserved to Sahara Net &copy; 1989 - 2026</footer>
    <div id="notification" class="notification-toast"><span id="notification-text"></span></div>

    <!-- Add/Edit plan modal -->
    <div id="popup-plan" class="custom-popup-overlay">
        <div class="custom-popup-box">
            <button class="custom-popup-close" onclick="closePopup('popup-plan')">&times;</button>
            <div class="popup-header"><h3 id="plan-modal-title">Add New Plan</h3></div>
            <div style="padding:20px;">
                <form id="planForm">
                    <input type="hidden" id="plan-id-field">
                    <div class="custom-form-group"><label>Name *</label><input type="text" id="plan-name" required></div>
                    <div class="custom-form-group"><label>Description</label><textarea id="plan-description" rows="3"></textarea></div>
                    <div class="custom-form-group"><label>Price (SAR) *</label><input type="number" id="plan-price" min="0" step="0.01" required></div>
                    <div class="custom-form-group"><label>Duration (months)</label><input type="number" id="plan-duration" min="1" value="1"></div>
                    <div class="custom-form-group"><label>Storage Size</label><input type="text" id="plan-storage" placeholder="e.g. 50GB"></div>
                    <div class="custom-form-group"><label>Bandwidth Limit</label><input type="text" id="plan-bandwidth" placeholder="e.g. 500GB"></div>
                    <button type="submit" class="checkout-btn">Save Plan</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        async function init() {
            const admin = await requireAdmin();
            if (!admin) return;
            loadPlans();
        }

        async function loadPlans() {
            const { data: plans, error } = await supabase.from('hosting_plan').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('plans-list');

            if (error) { container.innerHTML = `<p class="empty-state" style="color:red;">${error.message}</p>`; return; }
            if (!plans || plans.length === 0) { container.innerHTML = '<p class="empty-state">No plans yet. Click "Add New Plan" to create one.</p>'; return; }

            container.innerHTML = `
                <table class="data-table">
                    <thead><tr><th>Name</th><th>Price</th><th>Duration</th><th>Status</th><th></th></tr></thead>
                    <tbody>
                        ${plans.map(p => `
                            <tr>
                                <td>${p.name}</td>
                                <td>${p.price} SAR</td>
                                <td>${p.duration_months} mo</td>
                                <td><span class="status-badge status-${p.is_active ? 'active' : 'cancelled'}">${p.is_active ? 'active' : 'inactive'}</span></td>
                                <td>
                                    <button class="small-btn primary" onclick='editPlan(${JSON.stringify(p)})'>Edit</button>
                                    <button class="small-btn ${p.is_active ? 'danger' : ''}" onclick="togglePlanActive(${p.plan_id}, ${!p.is_active})">${p.is_active ? 'Deactivate' : 'Activate'}</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function openAddPlan() {
            document.getElementById('plan-modal-title').innerText = 'Add New Plan';
            document.getElementById('planForm').reset();
            document.getElementById('plan-id-field').value = '';
            openPopup('popup-plan');
        }

        function editPlan(plan) {
            document.getElementById('plan-modal-title').innerText = 'Edit Plan';
            document.getElementById('plan-id-field').value = plan.plan_id;
            document.getElementById('plan-name').value = plan.name;
            document.getElementById('plan-description').value = plan.description ?? '';
            document.getElementById('plan-price').value = plan.price;
            document.getElementById('plan-duration').value = plan.duration_months;
            document.getElementById('plan-storage').value = plan.storage_size ?? '';
            document.getElementById('plan-bandwidth').value = plan.bandwidth_limit ?? '';
            openPopup('popup-plan');
        }

        async function togglePlanActive(planId, newValue) {
            const { error } = await supabase.from('hosting_plan').update({ is_active: newValue }).eq('plan_id', planId);
            if (error) { showNotification(error.message, 'error'); return; }
            showNotification('Plan updated', 'success');
            loadPlans();
        }

        document.getElementById('planForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const planId = document.getElementById('plan-id-field').value;

            const payload = {
                name: document.getElementById('plan-name').value,
                description: document.getElementById('plan-description').value,
                price: parseFloat(document.getElementById('plan-price').value),
                duration_months: parseInt(document.getElementById('plan-duration').value) || 1,
                storage_size: document.getElementById('plan-storage').value,
                bandwidth_limit: document.getElementById('plan-bandwidth').value
            };

            let error;
            if (planId) {
                ({ error } = await supabase.from('hosting_plan').update(payload).eq('plan_id', planId));
            } else {
                payload.is_active = true;
                ({ error } = await supabase.from('hosting_plan').insert(payload));
            }

            if (error) { showNotification(error.message, 'error'); return; }
            showNotification('Plan saved successfully', 'success');
            closePopup('popup-plan');
            loadPlans();
        });

        init();
    </script>
</body>
</html>
