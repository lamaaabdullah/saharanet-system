<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Detail - Admin - Sahara Net</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="page-wrapper">
        <header class="custom-clean-header">
            <div class="header-top-row">
                <a href="admin-dashboard.html"><img src="images/Sahara-Net-logo.png" class="clean-logo-img"></a>
                <span style="font-weight:700; color:#5d3567;">ADMIN</span>
            </div>
            <div class="header-navigation-bar">
                <button class="nav-toggle-btn" onclick="toggleMobileNav()" aria-label="Menu">&#9776;</button>
                <ul id="main-nav-list">
                    <li><a href="admin-dashboard.html">Dashboard</a></li>
                    <li><a href="admin-customers.html">Customers</a></li>
                    <li><a href="admin-plans.html">Plans</a></li>
                    <li><a href="admin-tickets.html">Support Tickets</a></li>
                    <li><a href="admin-reports.html">Reports</a></li>
                    <li><a href="admin-settings.html">Settings</a></li>
                    <li><a href="#" onclick="logoutUser(); return false;">Logout</a></li>
                </ul>
            </div>
        </header>

        <section class="dashboard-content">
            <a href="admin-tickets.html" style="color:#5d3567; text-decoration:none; font-weight:600;">&larr; Back to Tickets</a>

            <div class="dashboard-card" style="margin-top:15px;">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:15px;">
                    <div>
                        <h2 id="ticket-title" style="color:#5d3567; margin:0 0 5px;">Loading...</h2>
                        <p id="ticket-customer" style="color:#777; margin:0;"></p>
                        <p id="ticket-contact" style="color:#777; margin:5px 0 0; font-size:.9rem;"></p>
                    </div>
                    <div style="text-align:right; min-width:200px;">
                        <label style="font-size:.85rem; color:#888; display:block; margin-bottom:5px;">Status</label>
                        <select id="status-select" style="padding:8px 12px; border-radius:8px; border:2px solid #e0e0e0; width:100%;">
                            <option value="open">Open</option>
                            <option value="in_progress">In Progress</option>
                            <option value="resolved">Resolved</option>
                            <option value="closed">Closed</option>
                        </select>
                    </div>
                </div>
                <p id="ticket-message" style="color:#555; white-space:pre-wrap; margin-top:15px; border-top:1px solid #eee; padding-top:15px;"></p>
                <button class="small-btn primary" onclick="assignToMe()">Assign to Me</button>
                <span id="assigned-label" style="margin-left:10px; color:#888; font-size:.9rem;"></span>
            </div>

            <div class="dashboard-card">
                <h3 style="color:#5d3567; margin-top:0;">Conversation</h3>
                <div id="replies-container" style="max-height:400px; overflow-y:auto; padding:10px 0;">
                    <p class="empty-state">Loading...</p>
                </div>

                <form id="replyForm" style="display:flex; gap:10px; margin-top:15px; border-top:1px solid #eee; padding-top:15px;">
                    <input type="text" id="reply-message" placeholder="Type your reply..." required style="flex:1; padding:12px; border-radius:8px; border:2px solid #e0e0e0;">
                    <button type="submit" class="small-btn primary" style="padding:0 25px;">Send</button>
                </form>
            </div>
        </section>
    </div>

    <footer id="footer">All rights reserved to Sahara Net &copy; 1989 - 2026</footer>
    <div id="notification" class="notification-toast"><span id="notification-text"></span></div>

    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        const ticketId = new URLSearchParams(window.location.search).get('id');
        let currentAdminId = null;

        async function init() {
            const admin = await requireAdmin();
            if (!admin) return;
            currentAdminId = admin.admin_id;

            if (!ticketId) {
                document.querySelector('.dashboard-content').innerHTML = '<p class="empty-state">No ticket specified.</p>';
                return;
            }

            await loadTicket();
            await loadReplies();
        }

        async function loadTicket() {
            const { data: ticket, error } = await supabase
                .from('support_logs')
                .select('*, customer:customer_id (name, email)')
                .eq('support_id', ticketId)
                .single();

            if (error || !ticket) {
                document.querySelector('.dashboard-content').innerHTML = '<p class="empty-state">Ticket not found.</p>';
                return;
            }

            document.getElementById('ticket-title').innerText = ticket.title;
            document.getElementById('ticket-customer').innerText = `${ticket.customer?.name ?? ''} • ${ticket.customer?.email ?? ''}`;
            document.getElementById('ticket-contact').innerText =
                (ticket.phone ? 'Phone: ' + ticket.phone : '') + (ticket.contact_email ? '  Contact Email: ' + ticket.contact_email : '');
            document.getElementById('ticket-message').innerText = ticket.content;
            document.getElementById('status-select').value = ticket.status;
            document.getElementById('assigned-label').innerText = ticket.admin_id ? `Assigned (Admin #${ticket.admin_id})` : 'Unassigned';
        }

        async function assignToMe() {
            const { error } = await supabase.from('support_logs').update({ admin_id: currentAdminId }).eq('support_id', ticketId);
            if (error) { showNotification(error.message, 'error'); return; }
            showNotification('Ticket assigned to you', 'success');
            loadTicket();
        }

        document.getElementById('status-select').addEventListener('change', async (e) => {
            const { error } = await supabase.from('support_logs').update({ status: e.target.value, updated_date: new Date().toISOString() }).eq('support_id', ticketId);
            if (error) { showNotification(error.message, 'error'); return; }
            showNotification('Status updated to ' + e.target.value, 'success');
        });

        async function loadReplies() {
            const { data: replies, error } = await supabase
                .from('ticket_replies')
                .select('*')
                .eq('support_id', ticketId)
                .order('created_at', { ascending: true });

            const container = document.getElementById('replies-container');
            if (error) { container.innerHTML = `<p class="empty-state" style="color:red;">${error.message}</p>`; return; }
            if (!replies || replies.length === 0) { container.innerHTML = '<p class="empty-state">No replies yet.</p>'; return; }

            container.innerHTML = replies.map(r => `
                <div class="chat-bubble ${r.sender_type === 'admin' ? 'customer' : 'admin'}">
                    ${r.message}
                    <span class="bubble-meta">${r.sender_type === 'admin' ? 'You (Support Team)' : 'Customer'} • ${new Date(r.created_at).toLocaleString()}</span>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('replyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = document.getElementById('reply-message').value;

            const { error } = await supabase.from('ticket_replies').insert({
                support_id: ticketId, sender_type: 'admin', sender_id: currentAdminId, message: message
            });

            if (error) { showNotification(error.message, 'error'); return; }

            document.getElementById('reply-message').value = '';
            showNotification('Reply sent!', 'success');
            loadReplies();
        });

        init();
    </script>
</body>
</html>
