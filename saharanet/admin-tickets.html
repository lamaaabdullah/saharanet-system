<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Tickets - Admin - Sahara Net</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="page-wrapper">
        <header class="custom-clean-header">
            <div class="header-top-row">
                <a href="admin-dashboard.html"><img src="images/Sahara-Net-logo.png" class="clean-logo-img"></a>
                <span style="font-weight:700; color:#5d3567;">ADMIN</span>
            </div>
            <div class="header-navigation-bar">
                <button class="nav-toggle-btn" onclick="toggleMobileNav()" aria-label="Menu">&#9776;</button>
                <ul id="main-nav-list">
                    <li><a href="admin-dashboard.html">Dashboard</a></li>
                    <li><a href="admin-customers.html">Customers</a></li>
                    <li><a href="admin-plans.html">Plans</a></li>
                    <li><a href="admin-tickets.html">Support Tickets</a></li>
                    <li><a href="admin-reports.html">Reports</a></li>
                    <li><a href="admin-settings.html">Settings</a></li>
                    <li><a href="#" onclick="logoutUser(); return false;">Logout</a></li>
                </ul>
            </div>
        </header>

        <section class="dashboard-content">
            <h1 style="color:#5d3567;">Support Tickets</h1>
            <p style="color:#777;">All customer support requests</p>

            <div class="dashboard-card">
                <div style="margin-bottom:15px;">
                    <label style="font-weight:600; color:#555; margin-right:10px;">Filter by status:</label>
                    <select id="status-filter" style="padding:8px 12px; border-radius:8px; border:2px solid #e0e0e0;">
                        <option value="all">All</option>
                        <option value="open">Open</option>
                        <option value="in_progress">In Progress</option>
                        <option value="resolved">Resolved</option>
                        <option value="closed">Closed</option>
                    </select>
                </div>
                <div id="tickets-list"><p class="empty-state">Loading...</p></div>
            </div>
        </section>
    </div>

    <footer id="footer">All rights reserved to Sahara Net &copy; 1989 - 2026</footer>
    <div id="notification" class="notification-toast"><span id="notification-text"></span></div>

    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        let allTickets = [];

        async function init() {
            const admin = await requireAdmin();
            if (!admin) return;
            await loadTickets();
        }

        async function loadTickets() {
            const { data: tickets, error } = await supabase
                .from('support_logs')
                .select('*, customer:customer_id (name, email)')
                .order('created_date', { ascending: false });

            const container = document.getElementById('tickets-list');
            if (error) { container.innerHTML = `<p class="empty-state" style="color:red;">${error.message}</p>`; return; }
            allTickets = tickets ?? [];
            renderTickets(allTickets);
        }

        function renderTickets(list) {
            const container = document.getElementById('tickets-list');
            if (list.length === 0) { container.innerHTML = '<p class="empty-state">No tickets found.</p>'; return; }

            container.innerHTML = `
                <table class="data-table">
                    <thead><tr><th>Subject</th><th>Customer</th><th>Date</th><th>Status</th><th></th></tr></thead>
                    <tbody>
                        ${list.map(t => `
                            <tr>
                                <td>${t.title}</td>
                                <td>${t.customer?.name ?? '-'}<br><small style="color:#888;">${t.customer?.email ?? ''}</small></td>
                                <td>${new Date(t.created_date).toLocaleDateString()}</td>
                                <td><span class="status-badge status-${t.status}">${t.status}</span></td>
                                <td><a href="admin-ticket-detail.html?id=${t.support_id}" class="small-btn primary" style="text-decoration:none;">Open</a></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        document.getElementById('status-filter').addEventListener('change', (e) => {
            const value = e.target.value;
            renderTickets(value === 'all' ? allTickets : allTickets.filter(t => t.status === value));
        });

        init();
    </script>
</body>
</html>
