<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Sahara Net</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="notification" class="notification-toast"><span id="notification-text"></span></div>

    <header class="custom-clean-header">
        <div class="header-top-row">
            <a href="index.html"><img src="images/Sahara-Net-logo.png" class="clean-logo-img"></a>
        </div>
    </header>

    <section class="login-container-section">
        <div class="login-card">
            <div class="login-header-zone"><h2>Forgot Password</h2></div>

            <form id="forgotForm">
                <div class="custom-form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" required>
                </div>
                <div class="submit-btn-zone"><button type="submit">Send Reset Link</button></div>
            </form>

            <div class="links-zone"><a href="login.html">Back to Login</a></div>
        </div>
    </section>

    <footer id="footer">All rights reserved to Sahara Net &copy; 1989 - 2026</footer>

    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const result = await sendPasswordReset(document.getElementById('email').value);
            showNotification(result.message, result.status);
        });
    </script>
</body>
</html>
