<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Subscription - Sahara Net</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .filter-buttons {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            color: #555;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .filter-btn.active, .filter-btn:hover {
            background-color: #5d3567;
            color: #fff;
            border-color: #5d3567;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header class="custom-clean-header">
            <div class="header-top-row">
                <a href="index.html"><img src="images/Sahara-Net-logo.png" class="clean-logo-img"></a>
            </div>
            <div class="header-navigation-bar">
                <button class="nav-toggle-btn" onclick="toggleMobileNav()" aria-label="Menu">&#9776;</button>
                <ul id="main-nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="customer-dashboard.html">Overview</a></li>
                    <li><a href="my-subscription.html">My Subscription</a></li>
                    <li><a href="my-invoices.html">Invoices</a></li>
                    <li><a href="support-tickets.html">Support</a></li>
                    <li><a href="profile-settings.html">Profile</a></li>
                    <li><a href="#" onclick="logoutUser(); return false;">Logout</a></li>
                </ul>
            </div>
        </header>

        <section class="dashboard-content">
            <h1 style="color:#5d3567;">My Subscription</h1>
            <p style="color:#777;">Manage your current services and subscriptions</p>

            
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterSubscriptions('all', this)">All</button>
                <button class="filter-btn" onclick="filterSubscriptions('active', this)">Active</button>
                <button class="filter-btn" onclick="filterSubscriptions('pending', this)">Pending </button>
                <button class="filter-btn" onclick="filterSubscriptions('cancelled', this)">Cancelled</button>
            </div>

            <div class="dashboard-card">
                <div id="subscriptions-list">
                    <p class="empty-state">Loading...</p>
                </div>
            </div>

            <div style="text-align:center;">
                <a href="index.html#plans-container" class="small-btn primary" style="text-decoration:none; display:inline-block; padding:10px 25px;">+ Browse More Plans</a>
            </div>
        </section>
    </div>

    <footer id="footer">All rights reserved to Sahara Net &copy; 1989 - 2026</footer>
    <div id="notification" class="notification-toast"><span id="notification-text"></span></div>

    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        let customerId = null;
        let allBookings = []; 
        let currentFilter = 'all';

        async function init() {
            const user = await requireLogin();
            if (!user) return;

            const { data: customer } = await supabase.from('customer').select('customer_id').eq('user_id', user.id).single();
            if (!customer) {
                document.getElementById('subscriptions-list').innerHTML = '<p class="empty-state" style="color:red;">Could not load your profile. Please log out and back in, or contact support.</p>';
                return;
            }
            customerId = customer.customer_id;

            loadSubscriptions();
        }

        async function loadSubscriptions() {
            const { data: bookings, error } = await supabase
                .from('booking')
                .select('booking_id, start_date, end_date, status, service:service_id (name, price)')
                .eq('customer_id', customerId)
                .order('start_date', { ascending: false });

            if (error) {
                document.getElementById('subscriptions-list').innerHTML = `<p class="empty-state" style="color:red;">${error.message}</p>`;
                return;
            }

            allBookings = bookings || [];
            renderSubscriptions();
        }

        function filterSubscriptions(status, btnElement) {
            currentFilter = status;
            
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            renderSubscriptions();
        }

        function renderSubscriptions() {
            const container = document.getElementById('subscriptions-list');

            const filteredBookings = currentFilter === 'all' 
                ? allBookings 
                : allBookings.filter(b => b.status === currentFilter);

            if (filteredBookings.length === 0) {
                container.innerHTML = "<p class=\"empty-state\">No subscriptions found for this filter.</p>";
                return;
            }

            container.innerHTML = `
                <table class="data-table">
                    <thead>
                        <tr><th>Service</th><th>Price</th><th>Start Date</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        ${filteredBookings.map(b => `
                            <tr>
                                <td>${b.service?.name ?? '-'}</td>
                                <td>${b.service?.price ?? 0} SAR</td>
                                <td>${b.start_date}</td>
                                <td><span class="status-badge status-${b.status}">${b.status}</span></td>
                                <td>
                                    ${b.status !== 'cancelled' ? `<button class="small-btn danger" onclick="cancelSubscription(${b.booking_id})">Cancel</button>` : ''}
                                    ${b.status === 'expired' || b.status === 'cancelled' ? `<button class="small-btn primary" onclick="renewSubscription(${b.booking_id})">Renew</button>` : ''}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function cancelSubscription(bookingId) {
            if (!confirm('Are you sure you want to cancel this subscription?')) return;
            const { error } = await supabase.from('booking').update({ status: 'cancelled' }).eq('booking_id', bookingId);
            if (error) { showNotification(error.message, 'error'); return; }
            showNotification('Subscription cancelled', 'success');
            loadSubscriptions();
        }

        async function renewSubscription(bookingId) {
            const { error } = await supabase.from('booking').update({
                status: 'pending',
                start_date: new Date().toISOString().split('T')[0],
                end_date: null
            }).eq('booking_id', bookingId);
            if (error) { showNotification(error.message, 'error'); return; }
            showNotification('Renewal request sent successfully', 'success');
            loadSubscriptions();
        }

        init();
    </script>
</body>
</html>
