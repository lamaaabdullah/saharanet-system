<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Sahara Net</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="notification" class="notification-toast"><span id="notification-text"></span></div>

    <header class="custom-clean-header">
        <div class="header-top-row">
            <a href="index.html"><img src="images/Sahara-Net-logo.png" class="clean-logo-img"></a>
        </div>
    </header>

    <section class="login-container-section">
        <div class="login-card">
            <div class="login-header-zone"><h2>Set New Password</h2></div>

            <form id="resetForm">
                <div class="custom-form-group">
                    <label for="newPassword">New Password *</label>
                    <input type="password" id="newPassword" required minlength="6">
                </div>
                <div class="custom-form-group">
                    <label for="confirmPassword">Confirm New Password *</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <div class="submit-btn-zone"><button type="submit">Update Password</button></div>
            </form>
        </div>
    </section>

    <footer id="footer">All rights reserved to Sahara Net &copy; 1989 - 2026</footer>

    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showNotification('Passwords do not match', 'error');
                return;
            }

            const result = await updateMyPassword(newPassword);
            showNotification(result.message, result.status);
            if (result.status === 'success') {
                setTimeout(() => window.location.href = 'login.html', 2000);
            }
        });
    </script>
</body>
</html>
