<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Sahara Net</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="notification" class="notification-toast"><span id="notification-text"></span></div>

    <header class="custom-clean-header">
        <div class="header-top-row">
            <a href="index.html"><img src="images/Sahara-Net-logo.png" class="clean-logo-img"></a>
        </div>
    </header>

    <section class="login-container-section">
        <div class="login-card">
            <div class="login-header-zone"><h2>Create Account</h2></div>

            <form id="signupForm">
                <div class="custom-form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" required placeholder="Enter your full name">
                </div>

                <div class="custom-form-group">
                    <label for="account-type">Account Type *</label>
                    <select id="account-type" onchange="toggleCompanyField()" style="width:100%; padding:12px; border-radius:8px; border:2px solid #e0e0e0;">
                        <option value="individual">Individual</option>
                        <option value="company">Company</option>
                    </select>
                </div>

                <div class="custom-form-group" id="company-field-wrapper" style="display:none;">
                    <label for="company-name">Company Name *</label>
                    <input type="text" id="company-name" placeholder="Enter your Company Name">
                </div>

                <div class="custom-form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required placeholder="Enter your Email address">
                </div>

                <div class="custom-form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" required placeholder="Enter your Password">
                </div>

                <div class="custom-form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" required placeholder="Confirm password">
                </div>

                <div class="submit-btn-zone"><button type="submit">Create Account</button></div>
            </form>

            <div class="links-zone">
                <a href="login.html">Already have an account? Login</a>
            </div>
        </div>
    </section>

    <footer id="footer">All rights reserved to Sahara Net &copy; 1989 - 2026</footer>

    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        // Show/hide company name field based on account type
        function toggleCompanyField() {
            const accountType = document.getElementById('account-type').value;
            const wrapper = document.getElementById('company-field-wrapper');
            const input = document.getElementById('company-name');

            if (accountType === 'company') {
                wrapper.style.display = 'block';
                input.setAttribute('required', 'required');
            } else {
                wrapper.style.display = 'none';
                input.removeAttribute('required');
                input.value = '';
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            
            if (name.length < 3) {
                showNotification('Error: Full Name must be at least 3 characters long', 'error');
                return;
            }

            
            if (email.length < 8) {
                showNotification('Error: Email must be at least 8 characters long', 'error');
                return;
            }
            try {
               
                const { data: customerData } = await window.supabaseClient
                    .from('customers')
                    .select('email')
                    .eq('email', email);


                    const { data: adminData } = await window.supabaseClient
                    .from('admin')
                    .select('email')
                    .eq('email', email);


                    const isEmailRegistered = (customerData && customerData.length > 0) || 
                                          (adminData && adminData.length > 0);

                if (isEmailRegistered) {
                    showNotification('Error: This email is already registered in our system', 'error');
                    return; 
                }
            } catch (err) {
                console.error("Error checking email existence:", err);
               
            }

            if (password.length < 8) {
                showNotification('Error: Password must be at least 8 characters long', 'error');
                return;
            }
            if (!/[A-Z]/.test(password)) {
                showNotification('Error: Password must contain at least one uppercase letter (A-Z)', 'error');
                return;
            }
            if (!/[a-z]/.test(password)) {
                showNotification('Error: Password must contain at least one lowercase letter (a-z)', 'error');
                return;
            }


            if (password !== confirmPassword) {
                showNotification('Error: Password and Confirm Password do not match', 'error');
                return;
            }


            const accountType = document.getElementById('account-type').value;
            const companyValue = accountType === 'company'
                ? document.getElementById('company-name').value
                : '';

            const result = await signUpCustomer(
                name,
                email,
                companyValue,
                password
            );
            
            showNotification(result.message, result.status);

            if (result.status === 'success') {
                setTimeout(() => window.location.href = 'customer-dashboard.html', 1500);
            }
        });
    </script>
</body>
</html>
