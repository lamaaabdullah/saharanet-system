<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Tickets - Sahara Net</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
       
        .filter-buttons {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            color: #555;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .filter-btn.active, .filter-btn:hover {
            background-color: #5d3567;
            color: #fff;
            border-color: #5d3567;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header class="custom-clean-header">
            <div class="header-top-row">
                <a href="index.html"><img src="images/Sahara-Net-logo.png" class="clean-logo-img"></a>
            </div>
            <div class="header-navigation-bar">
                <button class="nav-toggle-btn" onclick="toggleMobileNav()" aria-label="Menu">&#9776;</button>
                <ul id="main-nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="customer-dashboard.html">Overview</a></li>
                    <li><a href="my-subscription.html">My Subscription</a></li>
                    <li><a href="my-invoices.html">Invoices</a></li>
                    <li><a href="support-tickets.html">Support</a></li>
                    <li><a href="profile-settings.html">Profile</a></li>
                    <li><a href="#" onclick="logoutUser(); return false;">Logout</a></li>
                </ul>
            </div>
        </header>

        <section class="dashboard-content">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <div>
                    <h1 style="color:#5d3567; margin-bottom:5px;">Support Tickets</h1>
                    <p style="color:#777; margin-top:0;">Track your support requests</p>
                </div>
                <button class="small-btn primary" style="padding:10px 20px;" onclick="openPopup('popup-new-ticket')">+ New Ticket</button>
            </div>

            <div class="filter-buttons" style="margin-top: 20px;">
                <button class="filter-btn active" onclick="filterTickets('all', this)">All</button>
                <button class="filter-btn" onclick="filterTickets('open', this)">Open</button>
                <button class="filter-btn" onclick="filterTickets('in_progress', this)">In Progress</button>
                <button class="filter-btn" onclick="filterTickets('resolved', this)">Resolved</button>
                <button class="filter-btn" onclick="filterTickets('closed', this)">Closed</button>
            </div>

            <div class="dashboard-card">
                <div id="tickets-list">
                    <p class="empty-state">Loading...</p>
                </div>
            </div>
        </section>
    </div>

    <footer id="footer">All rights reserved to Sahara Net &copy; 1989 - 2026</footer>
    <div id="notification" class="notification-toast"><span id="notification-text"></span></div>

    <!-- New ticket popup -->
    <div id="popup-new-ticket" class="custom-popup-overlay">
        <div class="custom-popup-box">
            <button class="custom-popup-close" onclick="closePopup('popup-new-ticket')">&times;</button>
            <div class="popup-header"><h3>New Support Ticket</h3></div>
            <div style="padding:20px;">
                <form id="newTicketForm">
                    <div class="custom-form-group">
                        <label>Subject *</label>
                        <input type="text" id="ticket-title" required placeholder="What's this about?">
                    </div>
                    <div class="custom-form-group">
                        <label>Message *</label>
                        <textarea id="ticket-message" rows="4" required placeholder="Describe your issue in detail"></textarea>
                    </div>
                    <button type="submit" class="checkout-btn">Submit Ticket</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        let customerId = null;
        let allTickets = [];
        let currentFilter = 'all';

        async function init() {
            const user = await requireLogin();
            if (!user) return;

            const { data: customer } = await supabase.from('customer').select('customer_id').eq('user_id', user.id).single();
            if (!customer) {
                document.getElementById('tickets-list').innerHTML = '<p class="empty-state" style="color:red;">Could not load your profile. Please log out and back in, or contact support.</p>';
                return;
            }
            customerId = customer.customer_id;

            loadTickets();
        }

        async function loadTickets() {
            const { data: tickets, error } = await supabase
                .from('support_logs')
                .select('*')
                .eq('customer_id', customerId)
                .order('created_date', { ascending: false });

            const container = document.getElementById('tickets-list');

            if (error) {
                container.innerHTML = `<p class="empty-state" style="color:red;">${error.message}</p>`;
                return;
            }

            allTickets = tickets || [];
            renderTickets();
        }

        function filterTickets(status, btnElement) {
            currentFilter = status;
            
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            renderTickets();
        }

        function renderTickets() {
            const container = document.getElementById('tickets-list');

            const filteredTickets = currentFilter === 'all' 
                ? allTickets 
                : allTickets.filter(t => t.status === currentFilter);

            if (filteredTickets.length === 0) {
                container.innerHTML = '<p class="empty-state">No tickets found for this filter.</p>';
                return;
            }

            container.innerHTML = `
                <table class="data-table">
                    <thead>
                        <tr><th>Subject</th><th>Date</th><th>Status</th><th></th></tr>
                    </thead>
                    <tbody>
                        ${filteredTickets.map(t => `
                            <tr>
                                <td>${t.title}</td>
                                <td>${new Date(t.created_date).toLocaleDateString()}</td>
                                <td><span class="status-badge status-${t.status}">${t.status}</span></td>
                                <td><a href="ticket-detail.html?id=${t.support_id}" class="small-btn primary" style="text-decoration:none;">View</a></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        document.getElementById('newTicketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('ticket-title').value;
            const content = document.getElementById('ticket-message').value;

            const { error } = await supabase.from('support_logs').insert({
                title: title, content: content, status: 'open', customer_id: customerId
            });

            if (error) { showNotification(error.message, 'error'); return; }

            showNotification('Ticket created successfully!', 'success');
            document.getElementById('newTicketForm').reset();
            closePopup('popup-new-ticket');
            loadTickets();
        });

        init();
    </script>
</body>
</html>
